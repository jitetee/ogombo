<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("eo-theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<link rel="stylesheet" href="/css/retro.css">
<link rel="stylesheet" href="/css/extras.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main><div class="wrap">
<section class="hero" style="padding-top:1.2rem"><span class="kicker">ADS.EXE</span><h1>Ads &amp; sponsors</h1></section>
<div id="tabs"></div><div id="pane"></div>
</div></main>
<script src="/js/firebase-config.js"></script>
<script src="/js/ads.js"></script>
<script src="/admin/admin.js"></script>
<script>
(async () => {
  await A.guard("ads");
  const E = A.esc, $ = (s, r) => (r || document).querySelector(s), pane = $("#pane");
  const TYPES = EO_ADS.TYPES, tl = (k) => (TYPES.find((t) => t.key === k) || { label: k }).label;
  const today = A.today();
  const addDays = (d, n) => new Date(new Date(d + "T00:00:00Z").getTime() + n * 864e5).toISOString().slice(0, 10);
  const kes = (n) => "KES " + Number(n || 0).toLocaleString("en-KE");
  const asObj = (x) => (Array.isArray(x) ? Object.fromEntries(x.map((v, i) => [String(i), v]).filter(([, v]) => v)) : x || {});
  const arr = (x) => (Array.isArray(x) ? x : Object.values(x || {}));
  const D = { ads: {}, reqs: {}, pk: {}, set: {}, sponsors: {}, stats: null, pages: null };
  async function load() {
    const r = await Promise.all(["ads", "sponsor_requests", "ad_packages", "ad_settings", "sponsors", "ad_coupons", "sponsor_fulfil", "ad_templates", "sponsor_notes", "ad_pause"].map((p) => A.get(p).catch(() => null)));
    D.ads = asObj(r[0]); D.reqs = asObj(r[1]); D.pk = asObj(r[2]); D.set = r[3] || {}; D.sponsors = asObj(r[4]); D.coupons = asObj(r[5]); D.ful = asObj(r[6]); D.tpl = asObj(r[7]); D.notes = asObj(r[8]); D.pause = asObj(r[9]); D.stats = null; D.pages = null;
  }
  const getStats = async () => D.stats || (D.stats = asObj(await A.get("ad_stats")));
  const state = (a) => (String(a.active).toLowerCase() === "no" || a.active === false ? "off" : a.start && a.start > today ? "scheduled" : a.end && a.end < today ? "expired" : "live");
  const reqState = (r) => (r.status === "live" && r.end && r.end < today ? "expired" : r.status);
  const chips = (list) => `<span class="chips">${list.map((t) => `<span class="chip">${E(tl(t))}</span>`).join("")}</span>`;
  const wa = (phone, text) => { let n = String(phone || "").replace(/\D/g, ""); if (n.startsWith("0")) n = "254" + n.slice(1); return n ? `https://wa.me/${n}?text=${encodeURIComponent(text || "")}` : ""; };
  const MSG_DEF = {
    paid: "Hello {name}, we received your payment for request {id}. We are verifying it and will switch your ad on within 24 hours.",
    live: "Hello {name}, your ad \"{ad}\" is now live until {end}. You can follow views and clicks in your sponsor dashboard. Thank you!",
    pics: "Hello {name}, please send the pictures for your ad request {id} here on WhatsApp so we can add them to your ads.",
    notfound: "Hello {name}, we could not find your payment for request {id}. Please check the M-Pesa code and send it again in your dashboard.",
    expiring: "Hello {name}, your ad \"{ad}\" ends on {end}. Reply here if you would like to renew or extend it.",
    rejected: "Hello {name}, sorry, we cannot run the ad for request {id}. {note}",
  };
  const MSG_LABEL = { paid: "Payment received", live: "Ad is live", pics: "Please send pictures", notfound: "Payment not found", expiring: "Expiring soon / renew", rejected: "Request rejected" };
  const waText = (key, r, rid) => String((D.set.wa && D.set.wa[key]) || MSG_DEF[key] || "").replace(/\{(\w+)\}/g, (_, k) => { const v = { name: String(r.sponsor_name || "").split(" ")[0] || "there", id: rid, ad: (r.ad && r.ad.headline) || "", end: r.end || "", amount: kes(r.price), note: r.admin_note || "" }[k]; return v == null ? "" : v; }).replace(/\s+$/, "");
  const waFor = (key, rid, r) => wa(r.sponsor_phone, waText(key, r, rid));
  const bannedList = () => String(D.set.banned || "").toLowerCase().split(/[\n,;]+/).map((x) => x.trim()).filter(Boolean);
  const creativesOfR = (r) => [r.ad].concat(Array.from({ length: 14 }, (_, i) => (r.more_ads || {})["a" + (i + 2)])).filter(Boolean);
  let availJson = "";
  // public "booked" ranges so sponsors can see which dates are taken (only campaigns that are live / scheduled)
  async function publishAvailability() {
    const out = {};
    Object.values(D.reqs).forEach((r) => {
      if (!["live", "edit_submitted"].includes(r.status) || !r.start || !r.end || r.end < today) return;
      String(r.placements || "").split(",").map((x) => x.trim()).filter(Boolean).forEach((t) => { (out[t] = out[t] || []).push({ s: r.start, e: r.end }); });
    });
    D.avail = out;
    const j = JSON.stringify(out); if (j === availJson) return; availJson = j;
    try { await A.set("ad_availability", Object.keys(out).length ? out : null); } catch {}
  }
  const field = (label, inner, wide, help) => `<div class="field" ${wide ? 'style="grid-column:1/-1"' : ""}><label>${label}</label>${inner}${help ? `<small>${help}</small>` : ""}</div>`;
  const btn = (l, c, f) => A.btn(l, c, f);

  // shrink a picked image to a small JPEG data URL (<150 KB) for the database
  const imgToData = (file) => new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error("Pick an image file."));
    const url = URL.createObjectURL(file), im = new Image();
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read that image.")); };
    im.onload = () => {
      URL.revokeObjectURL(url); let w = Math.min(900, im.naturalWidth), q = 0.85;
      for (let i = 0; i < 14; i++) {
        const h = Math.round(im.naturalHeight * (w / im.naturalWidth)), c = document.createElement("canvas"); c.width = w; c.height = h;
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        const u = c.toDataURL("image/jpeg", q); if (u.length < 150000) return resolve(u);
        if (q > 0.5) q -= 0.1; else w = Math.round(w * 0.8);
      }
      reject(new Error("That image is too detailed to shrink."));
    };
    im.src = url;
  });
  async function resolveImg(v) {
    v = String(v || "");
    if (v.startsWith("db:")) return (await A.get("ad_images/" + v.slice(3))) || "";
    if (v.startsWith("dbp:")) return (await A.get("ad_images_pending/" + v.slice(4))) || "";
    return v;
  }
  const clip = (s, n) => String(s || "").slice(0, n);

  // =====================================================================
  // revenue rows from verified sponsor payments, extensions and direct deals
  function revenueRows() {
    const rows = [], day = (ts) => new Date(ts).toISOString().slice(0, 10);
    Object.entries(D.reqs).forEach(([rid, r]) => {
      const who = r.sponsor_name || r.sponsor_email || "";
      if (r.payment && r.payment.status === "verified") rows.push({ date: day(r.verified_at || r.updated || r.created), sponsor: who, amount: Number(r.price) || 0, kind: "package", ref: r.package_name || "", ad: r.ad_id || "" });
      arr(r.extensions).forEach((x) => rows.push({ date: day(x.ts), sponsor: who, amount: Number(x.amount) || 0, kind: "extension", ref: `+${x.days} days`, ad: r.ad_id || "" }));
    });
    Object.entries(D.ads).forEach(([id, a]) => { if (!a.request && Number(a.price_paid) > 0) rows.push({ date: a.paid_on || a.start || today, sponsor: a.sponsor_name || "", amount: Number(a.price_paid), kind: "direct deal", ref: a.headline, ad: id }); });
    return rows.sort((a, b) => b.date.localeCompare(a.date));
  }
  const earnedBy = () => { const m = {}; revenueRows().forEach((r) => { if (r.ad) m[r.ad] = (m[r.ad] || 0) + r.amount; }); return m; };

  // =====================================================================
  // add / edit an ad
  function adForm(key, existing, after) {
    const a = Object.assign({ headline: "", body: "", cta: "Learn more", link: "", accent: "green", sponsor: "", placement: "header", active: "yes", start: "", end: "" }, existing || {});
    const cur = new Set(EO_ADS.placesOf(a));
    const form = document.createElement("div");
    form.innerHTML = `<div class="grid2">
      ${field("Headline *", `<input id="a_headline" maxlength="80" value="${E(a.headline)}">`, true)}
      ${field("Text", `<textarea id="a_body" rows="2" maxlength="220">${E(a.body || "")}</textarea>`, true)}
      ${field("Link * (https://… or /page)", `<input id="a_link" maxlength="300" value="${E(a.link)}">`)}
      ${field("Button text", `<input id="a_cta" maxlength="24" value="${E(a.cta || "")}">`)}
      ${field("Small label", `<input id="a_sponsor" maxlength="30" value="${E(a.sponsor || "")}" placeholder="Ad / Sponsored / Socials">`)}
      ${field("Colour", `<select id="a_accent">${["green", "amber", "magenta"].map((c) => `<option ${a.accent === c ? "selected" : ""}>${c}</option>`).join("")}</select>`)}
      ${field("Active", `<select id="a_active"><option ${state(a) !== "off" ? "selected" : ""} value="yes">yes — shown</option><option ${state(a) === "off" ? "selected" : ""} value="no">no — hidden</option></select>`)}
      <div></div>
      ${field("Only beside posts tagged… (optional)", `<input id="a_tags" maxlength="120" value="${E(a.tags || "")}" placeholder="e.g. nursing, theatre">`, false, "Comma-separated post tags. Leave empty to show everywhere. Not applied to header, footer and text links.")}<div></div>
      ${field("Custom colour (optional)", `<input id="a_color" maxlength="7" value="${E(a.color || "")}" placeholder="#12a4ff">`, false, "A hex colour like #12a4ff. Overrides the colour above.")}
      ${field("Pin to the front", `<select id="a_pin"><option value="no">no</option><option value="yes" ${a.pin === true || a.pin === "yes" ? "selected" : ""}>yes — first in the rotation</option></select>`)}
      ${field("Only on these days (Kenya time)", `<div class="plgrid">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d, i) => `<label><input type="checkbox" data-dow="${i}" ${String(a.days_of_week == null ? "" : a.days_of_week).split(",").includes(String(i)) ? "checked" : ""}> ${d}</label>`).join("")}</div>`, true, "Leave all unticked for every day.")}
      ${field("From hour (0–23)", `<input id="a_hf" type="number" min="0" max="24" value="${E(a.hour_from == null ? "" : a.hour_from)}">`)}
      ${field("To hour (1–24)", `<input id="a_ht" type="number" min="0" max="24" value="${E(a.hour_to == null ? "" : a.hour_to)}">`, false, "e.g. 18 to 23 = evenings only.")}
      ${field("A/B test group (optional)", `<input id="a_ab" maxlength="30" value="${E(a.ab || "")}" placeholder="e.g. rcb-headline">`, true, "Give two or more ads the same group name: each visitor sees only one of them. Compare them in Analytics → A/B tests.")}
      ${field("WhatsApp lead number (optional)", `<input id="a_leadwa" maxlength="20" value="${E(a.lead_wa || "")}" placeholder="07xx xxx xxx">`, false, "The button opens a WhatsApp chat; taps are counted as leads.")}
      ${field("Show only to… (language)", `<select id="a_lang"><option value="">everyone</option><option value="sw" ${a.lang === "sw" ? "selected" : ""}>Swahili browsers</option><option value="en" ${a.lang === "en" ? "selected" : ""}>English browsers</option></select>`)}
      ${field("Show only to… (country)", `<select id="a_geo"><option value="">everyone</option><option value="ke" ${a.geo === "ke" ? "selected" : ""}>visitors in Kenya</option><option value="intl" ${a.geo === "intl" ? "selected" : ""}>visitors outside Kenya</option></select>`, false, "Detected from the visitor's phone time zone and language. Nothing is stored.")}
      ${field("Start date (optional)", `<input id="a_start" type="date" value="${E(a.start || "")}">`)}
      ${field("End date (optional)", `<input id="a_end" type="date" value="${E(a.end || "")}">`)}
    </div>
    <label>Where it shows *</label>
    <div class="plgrid">${TYPES.map((t) => `<label title="${E(t.desc)}"><input type="checkbox" data-pl="${t.key}" ${cur.has(t.key) ? "checked" : ""}> ${E(t.label)}</label>`).join("")}</div>
    <div class="grid2">
      ${field("Picture path / link", `<input id="a_img" value="${E(/^db:/.test(a.image || "") ? "" : a.image || "")}" placeholder="/assets/ads/pic.jpg or https://…"><small>Upload the file into <code>assets/ads/</code> (no database storage), redeploy, then paste its path. <br><label style="display:inline"><input type="checkbox" id="a_noimg" style="width:auto"> remove picture</label></small>`)}
      ${field("Advertiser (for your records)", `<input id="a_spname" value="${E(a.sponsor_name || "")}">`)}
      ${field("Amount paid (KES)", `<input id="a_price" type="number" min="0" value="${E(a.price_paid || "")}">`, false, "For deals you made yourself. Counts in the revenue report.")}
      ${field("Paid on", `<input id="a_paid" type="date" value="${E(a.paid_on || "")}">`)}
      ${field("Private notes", `<input id="a_notes" value="${E(a.notes || "")}">`)}
    </div>
    <div class="toolbar" style="margin-top:.6rem"><select id="a_tpl"><option value="">Load a template…</option>${Object.entries(D.tpl || {}).map(([k, t]) => `<option value="${E(k)}">${E(t.name)}</option>`).join("")}</select><button class="btn sm" id="a_savetpl" type="button">Save as template</button></div>
    <div id="a_prev"></div>`;
    const prev = async () => {
      const pls = [...form.querySelectorAll("[data-pl]:checked")].map((c) => c.dataset.pl);
      const ad = { headline: $("#a_headline", form).value, body: $("#a_body", form).value, cta: $("#a_cta", form).value || "Learn more", link: "#", accent: $("#a_accent", form).value, sponsor: $("#a_sponsor", form).value || "Ad", image: fileData || $("#a_img", form).value || (existingImg && !$("#a_noimg", form).checked ? existingImg : "") };
      const seen = new Set();
      $("#a_prev", form).innerHTML = "<h3>Preview</h3>" + pls.map((t) => { const f = (TYPES.find((x) => x.key === t) || {}).fmt; if (seen.has(f)) return ""; seen.add(f); return `<div class="prev-box"><span class="hint">${E(tl(t))}</span>${EO_ADS.previewHTML(ad, t)}</div>`; }).join("");
    };
    let fileData = "", existingImg = "";
    if (a.image && /^db/.test(a.image)) resolveImg(a.image).then((u) => { existingImg = u; prev(); });
    else if (a.image) existingImg = a.image;
    form.addEventListener("input", prev); form.addEventListener("change", prev); prev();
    const TPLK = ["headline", "body", "cta", "link", "accent", "sponsor", "placement", "tags", "color", "days_of_week", "hour_from", "hour_to"];
    $("#a_tpl", form).onchange = (e) => {
      const t = (D.tpl || {})[e.target.value]; if (!t) return;
      const set = (id, v) => { $("#" + id, form).value = v == null ? "" : v; };
      set("a_headline", t.headline); set("a_body", t.body); set("a_cta", t.cta); set("a_link", t.link); set("a_accent", t.accent || "green"); set("a_sponsor", t.sponsor); set("a_tags", t.tags); set("a_color", t.color); set("a_hf", t.hour_from); set("a_ht", t.hour_to);
      const pl = new Set(EO_ADS.placesOf(t)); form.querySelectorAll("[data-pl]").forEach((c) => (c.checked = pl.has(c.dataset.pl)));
      form.querySelectorAll("[data-dow]").forEach((c) => (c.checked = String(t.days_of_week == null ? "" : t.days_of_week).split(",").includes(c.dataset.dow)));
      prev();
    };
    $("#a_savetpl", form).onclick = async () => {
      const name = prompt("Template name?"); if (!name) return;
      const g = (id) => $("#" + id, form).value.trim();
      const t = { name: clip(name, 40), headline: g("a_headline"), body: g("a_body"), cta: g("a_cta"), link: g("a_link"), accent: g("a_accent"), sponsor: g("a_sponsor"), placement: [...form.querySelectorAll("[data-pl]:checked")].map((c) => c.dataset.pl).join(","), tags: g("a_tags"), color: g("a_color"), hour_from: g("a_hf"), hour_to: g("a_ht"), days_of_week: [...form.querySelectorAll("[data-dow]:checked")].map((c) => c.dataset.dow).join(",") };
      Object.keys(t).forEach((k) => { if (t[k] === "") delete t[k]; });
      try { const id = "t" + Date.now().toString(36); await A.set("ad_templates/" + id, t); D.tpl = Object.assign({}, D.tpl, { [id]: t }); A.toast("Template saved ✓"); } catch (e) { A.toast(e.message, true); }
    };
    const save = btn("Save", "primary"), cancel = btn("Cancel");
    const m = A.modal(key ? "Edit ad" : "New ad", form, [cancel, save], true);
    cancel.onclick = m.close;
    save.onclick = async () => {
      const v = (id) => $("#" + id, form).value.trim();
      const pls = [...form.querySelectorAll("[data-pl]:checked")].map((c) => c.dataset.pl);
      if (!v("a_headline")) return A.toast("Headline is required", true);
      if (!/^(https?:\/\/|\/)\S+/i.test(v("a_link"))) return A.toast("Link must start with https:// or /", true);
      if (!pls.length) return A.toast("Tick at least one place for the ad to show", true);
      const id = key || (A.slugify(v("a_headline")).slice(0, 40) || "ad") + "-" + Date.now().toString(36).slice(-4);
      const rec = Object.assign({}, existing || {}, { headline: v("a_headline"), body: v("a_body"), cta: v("a_cta"), link: v("a_link"), accent: v("a_accent"), sponsor: v("a_sponsor"), placement: pls.join(","), active: v("a_active"), start: v("a_start"), end: v("a_end"), tags: v("a_tags").toLowerCase(), color: v("a_color"), ab: v("a_ab"), lead_wa: v("a_leadwa").replace(/[^\d+]/g, ""), lang: v("a_lang"), geo: v("a_geo"), pin: v("a_pin") === "yes", days_of_week: [...form.querySelectorAll("[data-dow]:checked")].map((c) => c.dataset.dow).join(","), hour_from: v("a_hf") === "" ? "" : Math.max(0, Math.min(24, Math.round(Number(v("a_hf"))))), hour_to: v("a_ht") === "" ? "" : Math.max(0, Math.min(24, Math.round(Number(v("a_ht"))))), sponsor_name: v("a_spname"), paid_on: v("a_paid"), notes: v("a_notes") });
      const price = Number(v("a_price")); if (price > 0) rec.price_paid = price; else delete rec.price_paid;
      ["body", "cta", "sponsor", "start", "end", "tags", "sponsor_name", "paid_on", "notes", "color", "ab", "days_of_week", "hour_from", "hour_to", "lead_wa", "lang", "geo"].forEach((k) => { if (rec[k] === "" || rec[k] == null || rec[k] === false) delete rec[k]; });
      if (rec.color && !/^#[0-9a-fA-F]{6}$/.test(rec.color)) return A.toast("Custom colour must look like #12a4ff", true);
      if (!rec.pin) delete rec.pin;
      save.disabled = true;
      try {
        if ($("#a_noimg", form).checked) delete rec.image;
        else if (v("a_img")) rec.image = A.driveImg(v("a_img"));
        delete rec._key; delete rec.id; rec.id = id;
        await A.set("ads/" + id, rec);
        if (rec.request) await A.update("sponsor_requests/" + rec.request, { ad: { headline: clip(rec.headline, 80), body: clip(rec.body, 220), cta: clip(rec.cta, 24), link: clip(rec.link, 300), image: clip(rec.image, 600), accent: rec.accent, sponsor: clip(rec.sponsor, 30), wa: rec.lead_wa ? clip(rec.lead_wa, 20) : null }, updated: Date.now() }).catch(() => {});
        m.close(); A.toast("Saved ✓"); await after();
      } catch (e) { A.toast("Save failed: " + e.message, true); save.disabled = false; }
    };
  }

  // =====================================================================
  // per-ad metrics popup
  async function adMetrics(id) {
    const a = D.ads[id] || { headline: id };
    const days = asObj((await getStats())[id]);
    const pages = asObj(await A.get("ad_pages/" + id));
    const box = document.createElement("div");
    const m = A.modal("Results — " + a.headline, box, null, true);
    const draw = (from) => {
      const to = today, sm = EO_ADS.summarize(days, from, to), earned = earnedBy()[id] || 0;
      const row = (k, v) => `<tr><td>${E(k)}</td><td>${v.v}</td><td>${v.c}</td><td>${v.v ? (v.c / v.v * 100).toFixed(2) : "0.00"}%</td></tr>`;
      const pg = Object.entries(pages).sort((x, y) => (y[1].v || 0) - (x[1].v || 0)).slice(0, 10);
      box.innerHTML = `<div class="toolbar"><select id="rg"><option value="${addDays(today, -6)}">Last 7 days</option><option value="${addDays(today, -29)}">Last 30 days</option><option value="${addDays(today, -89)}">Last 90 days</option><option value="${Object.keys(days).sort()[0] || today}">All time</option></select></div>
        <div class="cards"><div class="stat"><b>${sm.v}</b><span>Views</span></div><div class="stat"><b>${sm.c}</b><span>Clicks</span></div><div class="stat"><b>${sm.ctr.toFixed(2)}%</b><span>CTR</span></div><div class="stat"><b>${sm.u}</b><span>Unique viewers (daily)</span></div>${sm.ld ? `<div class="stat"><b>${sm.ld}</b><span>WhatsApp chats started</span></div>` : ""}${sm.x ? `<div class="stat"><b>${sm.x}</b><span>Hid this ad</span></div>` : ""}<div class="stat"><b>${kes(earned)}</b><span>Earned</span></div><div class="stat"><b>${sm.v && earned ? kes(earned / sm.v * 1000) : "—"}</b><span>eCPM</span></div></div>
        ${EO_ADS.chartSVG(sm.byDay)}
        <div class="grid2"><div><h3>By spot</h3><table class="tbl"><thead><tr><th>Spot</th><th>Views</th><th>Clicks</th><th>CTR</th></tr></thead><tbody>${Object.entries(sm.byPl).map(([k, v]) => row(tl(k), v)).join("") || '<tr><td colspan="4" class="hint">No data yet.</td></tr>'}</tbody></table></div>
        <div><h3>Devices</h3><table class="tbl"><thead><tr><th>Device</th><th>Views</th><th>Clicks</th><th>CTR</th></tr></thead><tbody>${row("Phone", sm.byDev.m)}${row("Computer / tablet", sm.byDev.d)}</tbody></table>
        <h3>Top pages (all time)</h3><table class="tbl"><tbody>${pg.map(([k, v]) => `<tr><td class="mono">${E(k)}</td><td>${v.v || 0} v</td><td>${v.c || 0} c</td></tr>`).join("") || '<tr><td class="hint">No data yet.</td></tr>'}</tbody></table></div></div>`;
      $("#rg", box).value = from; $("#rg", box).onchange = (e) => draw(e.target.value);
    };
    draw(addDays(today, -29));
  }

  // =====================================================================
  // publish / approve / pause helpers for sponsor requests

    const r = D.reqs[rid], st = await getStats(), ids = reqAds(rid), days = sumDays(ids, st);
    const from = r.start || addDays(today, -29), to = r.end && r.end < today ? r.end : today, sm = EO_ADS.summarize(days, from, to);
    const adsum = ids.map((id) => { const x = EO_ADS.summarize(asObj(st[id]), from, to); return { h: clip((D.ads[id] || {}).headline, 80), v: x.v, c: x.c }; });
    return { sponsor: clip(r.sponsor_name, 60), package: clip(r.package_name, 40), start: r.start || "", end: r.end || "", v: sm.v, c: sm.c, u: sm.u, ld: sm.ld, ctr: Math.round(sm.ctr * 100) / 100, byDay: sm.byDay.slice(-120), byPl: sm.byPl, ads: adsum, updated: today };
  }
  async function analyticsTab() {
    pane.innerHTML = `<p class="hint">Loading…</p>`;
    const st = await getStats(), pages = asObj(await A.get("ad_pages").catch(() => null)), from = addDays(today, -29);
    const rev = revenueRows(), ym = today.slice(0, 7), month = rev.filter((x) => x.date.startsWith(ym)).reduce((n, x) => n + x.amount, 0), goal = Number(D.set.goal_month) || 0;
    // renewals
    const paidBy = {}; Object.values(D.reqs).forEach((r) => { if (r.payment && r.payment.status === "verified") paidBy[r.owner] = (paidBy[r.owner] || 0) + 1; });
    const buyers = Object.keys(paidBy).length, renewers = Object.values(paidBy).filter((n) => n > 1).length, renewRate = buyers ? renewers / buyers : 0;
    // forecast
    let running = 0, expected = 0;
    Object.values(D.reqs).forEach((r) => {
      if (r.status !== "live" || !r.end || r.end < today) return;
      const total = Math.max(1, (new Date(r.end) - new Date(r.start || today)) / 864e5 + 1), left = Math.max(0, (new Date(r.end) - new Date(today)) / 864e5 + 1);
      running += (Number(r.price) || 0) * Math.min(1, left / total);
      if (r.end <= addDays(today, 30)) expected += (Number(r.price) || 0) * renewRate;
    });
    // leaderboard
    const lb = {};
    Object.entries(D.reqs).forEach(([rid, r]) => {
      const o = (lb[r.owner] = lb[r.owner] || { name: r.sponsor_name || r.sponsor_email || r.owner, paid: 0, n: 0, v: 0, c: 0 });
      if (r.payment && r.payment.status === "verified") { o.n++; o.paid += (Number(r.price) || 0); }
      arr(r.extensions).forEach((x) => (o.paid += Number(x.amount) || 0));
      const sm = EO_ADS.summarize(sumDays(reqAds(rid), st)); o.v += sm.v; o.c += sm.c;
    });
    const lbRows = Object.entries(lb).filter(([, o]) => o.paid || o.v).sort((a, b) => b[1].paid - a[1].paid).slice(0, 15);
    // spot report card (30 days)
    const spot = {}; TYPES.forEach((t) => (spot[t.key] = { v: 0, c: 0 }));
    Object.values(st).forEach((d) => { const sm = EO_ADS.summarize(asObj(d), from, today); Object.entries(sm.byPl).forEach(([k, x]) => { if (spot[k]) { spot[k].v += x.v; spot[k].c += x.c; } }); });
    const liveN = (k) => Object.values(D.ads).filter((a) => a && a.headline && state(a) === "live" && EO_ADS.placesOf(a).includes(k)).length;
    const soldN = (k) => Object.values(D.reqs).filter((r) => r.status === "live" && r.end >= today && String(r.placements || "").split(",").map((x) => x.trim()).includes(k)).length;
    // heatmap data
    const heat = { v: Array.from({ length: 7 }, () => Array(24).fill(0)), c: Array.from({ length: 7 }, () => Array(24).fill(0)) };
    Object.values(st).forEach((d) => Object.entries(asObj(d)).forEach(([day, x]) => { if (day < from) return; const w = new Date(day + "T12:00:00Z").getUTCDay(); Object.entries(x).forEach(([k, n]) => { const m = k.match(/^([vc])h_(\d\d)$/); if (m) heat[m[1]][w][+m[2]] += n; }); }));
    // posts
    const pg = {}; Object.values(pages).forEach((o) => Object.entries(asObj(o)).forEach(([p, x]) => { const t = (pg[p] = pg[p] || { v: 0, c: 0 }); t.v += x.v || 0; t.c += x.c || 0; }));
    const pgRows = Object.entries(pg).filter(([, x]) => x.v >= 20).sort((a, b) => b[1].c / b[1].v - a[1].c / a[1].v || b[1].c - a[1].c).slice(0, 12);
    // A/B
    const ab = {}; Object.entries(D.ads).forEach(([k, a]) => { if (a && a.ab) { const x = EO_ADS.summarize(asObj(st[k]), from, today); (ab[a.ab] = ab[a.ab] || []).push({ k, a, v: x.v, c: x.c }); } });
    // funnel
    const reqs = Object.values(D.reqs), F = { acc: Object.keys(D.sponsors).length, started: reqs.length, sub: reqs.filter((r) => r.payment).length, ver: reqs.filter((r) => r.payment && r.payment.status === "verified").length, ren: renewers };
    const pct = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "—");
    const ctr = (x) => (x.v ? (x.c / x.v * 100).toFixed(2) : "0.00") + "%";
    const mx = (m) => Math.max(1, ...m.flat());
    const heatHTML = (m) => `<div class="tbl-wrap"><table class="tbl" style="font-size:.7rem"><thead><tr><th></th>${Array.from({ length: 24 }, (_, h) => `<th style="padding:2px">${h}</th>`).join("")}</tr></thead><tbody>${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d, i) => `<tr><th>${d}</th>${m[i].map((n, h) => `<td title="${d} ${h}:00 — ${n}" style="padding:2px;min-width:14px;background:rgba(0,200,120,${(n / mx(m)).toFixed(2)})">${n ? "" : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    const shareable = Object.entries(D.reqs).filter(([, r]) => ["live", "expired", "paused"].includes(r.status));
    pane.innerHTML = `
      <div class="crt-window"><div class="titlebar"><span class="label">goal-and-forecast</span></div><div class="body">
        <div class="cards"><div class="stat"><b>${kes(month)}</b><span>This month${goal ? " of " + kes(goal) : ""}</span></div><div class="stat"><b>${kes(Math.round(running))}</b><span>Paid & still running (pro-rata)</span></div><div class="stat"><b>${kes(Math.round(expected))}</b><span>Expected renewals · next 30 days</span></div><div class="stat"><b>${pct(renewers, buyers)}</b><span>Sponsors who came back</span></div></div>
        ${goal ? `<div style="background:var(--panel-border);height:10px;border-radius:5px;overflow:hidden"><div style="width:${Math.min(100, month / goal * 100).toFixed(0)}%;height:100%;background:var(--crt-green,#2ecc71)"></div></div><p class="hint">${Math.min(100, Math.round(month / goal * 100))}% of this month's goal. Set the goal in Ad types → settings.</p>` : `<p class="hint">Set a monthly goal in the Ad types tab to see a progress bar.</p>`}</div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">sponsor-leaderboard</span></div><div class="body tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Sponsor</th><th>Paid</th><th>Bookings</th><th>Views</th><th>Clicks</th><th>CTR</th><th>Came back</th></tr></thead><tbody>${lbRows.map(([k, o], i) => `<tr><td>${i + 1}</td><td>${E(o.name)}${(D.notes[k] || {}).tags ? ` <span class="chip">${E(D.notes[k].tags)}</span>` : ""}</td><td>${kes(o.paid)}</td><td>${o.n}</td><td>${o.v}</td><td>${o.c}</td><td>${ctr(o)}</td><td>${o.n > 1 ? "yes" : "—"}</td></tr>`).join("") || `<tr><td colspan="8" class="hint">No data yet.</td></tr>`}</tbody></table></div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">spot-report-card · 30 days</span></div><div class="body tbl-wrap"><table class="tbl"><thead><tr><th>Spot</th><th>Views</th><th>Clicks</th><th>CTR</th><th>Live ads</th><th>Sponsor campaigns</th><th>Limit</th></tr></thead><tbody>${TYPES.map((t) => `<tr><td>${E(t.label)}</td><td>${spot[t.key].v}</td><td>${spot[t.key].c}</td><td>${ctr(spot[t.key])}</td><td>${liveN(t.key)}</td><td>${soldN(t.key)}</td><td>${E((D.set.limits || {})[t.key] || "—")}</td></tr>`).join("")}</tbody></table><p class="hint">Spots with high views but nothing sold are your best ones to promote; spots with few views can be dropped from packages.</p></div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">best-times</span></div><div class="body"><div class="toolbar"><select id="hm"><option value="v">Views</option><option value="c">Clicks</option></select><span class="hint">Last 30 days · hours are Kenya time (EAT). Darker = more. Only counts from this version on.</span></div><div id="hmout">${heatHTML(heat.v)}</div></div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">posts-by-ad-clicks</span></div><div class="body tbl-wrap"><table class="tbl"><thead><tr><th>Page</th><th>Ad views</th><th>Ad clicks</th><th>CTR</th></tr></thead><tbody>${pgRows.map(([p, x]) => `<tr><td class="mono">${E(p)}</td><td>${x.v}</td><td>${x.c}</td><td>${ctr(x)}</td></tr>`).join("") || `<tr><td colspan="4" class="hint">Needs pages with at least 20 ad views.</td></tr>`}</tbody></table></div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">ab-tests</span></div><div class="body">${Object.entries(ab).map(([g, list]) => { const ok = list.every((x) => x.v >= 100), best = list.slice().sort((a, b) => b.c / (b.v || 1) - a.c / (a.v || 1))[0]; return `<h3>${E(g)}</h3><table class="tbl"><thead><tr><th>Variant</th><th>Views</th><th>Clicks</th><th>CTR</th></tr></thead><tbody>${list.map((x) => `<tr><td>${E(x.a.headline)}${ok && x === best ? ' <span class="pill live">winner</span>' : ""}</td><td>${x.v}</td><td>${x.c}</td><td>${ctr(x)}</td></tr>`).join("")}</tbody></table><p class="hint">${ok ? "Every variant has 100+ views, so the winner is reliable enough to keep." : "Wait until each variant has 100+ views before choosing a winner."}</p>`; }).join("") || `<p class="hint">No A/B tests yet. Give two ads the same “A/B test group” name in the ad form.</p>`}</div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">sales-funnel</span></div><div class="body"><div class="cards"><div class="stat"><b>${F.acc}</b><span>Sponsor accounts</span></div><div class="stat"><b>${F.started}</b><span>Requests started · ${pct(F.started, F.acc)}</span></div><div class="stat"><b>${F.sub}</b><span>Payment sent · ${pct(F.sub, F.started)}</span></div><div class="stat"><b>${F.ver}</b><span>Verified · ${pct(F.ver, F.sub)}</span></div><div class="stat"><b>${F.ren}</b><span>Renewed · ${pct(F.ren, buyers)}</span></div></div></div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">weekly-digests</span></div><div class="body"><p class="hint" style="margin-top:0">Last 7 days for every running campaign, as a ready WhatsApp message. Tap, check, send.</p><div class="tbl-wrap"><table class="tbl"><tbody id="dg"></tbody></table></div></div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">renewal-and-upsell-ideas</span></div><div class="body"><p class="hint" style="margin-top:0">Sponsors whose campaign is running or ended in the last 14 days. Good results → offer the next package; weak results → offer help first.</p><div class="tbl-wrap"><table class="tbl"><tbody id="up"></tbody></table></div></div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">share-links</span></div><div class="body"><p class="hint" style="margin-top:0">A private link a sponsor can open without logging in (e.g. to show their boss). It shows a snapshot that refreshes whenever you open this admin page. Anyone with the link can see it, so only send it to the sponsor.</p><div class="tbl-wrap"><table class="tbl"><tbody>${shareable.map(([rid, r]) => { const t = (D.ful[rid] || {}).share; return `<tr><td>${E(r.sponsor_name || "")} <span class="hint">${E(r.package_name || "")} · ${E(r.start || "")} → ${E(r.end || "")}</span></td><td class="act">${t ? `<button class="btn sm" data-copy="${E(t)}" type="button">Copy link</button> <button class="btn sm danger" data-unshare="${E(rid)}" type="button">Turn off</button>` : `<button class="btn sm primary" data-share="${E(rid)}" type="button">Create link</button>`}</td></tr>`; }).join("") || `<tr><td class="hint">No running or finished campaigns yet.</td></tr>`}</tbody></table></div></div></div>
      <div class="crt-window"><div class="titlebar"><span class="label">month-end-payments</span></div><div class="body"><div class="toolbar"><input type="month" id="me" value="${ym}"><button class="btn" id="me_csv" type="button">Download CSV</button><button class="btn" id="me_pr" type="button">Print</button></div><div id="meout"></div></div></div>`;
    // digests + upsell drafts
    const avgCtr = (() => { let v = 0, c = 0; Object.values(st).forEach((d) => { const x = EO_ADS.summarize(asObj(d), from, today); v += x.v; c += x.c; }); return v >= 200 ? (c / v) * 100 : Number(D.aud && D.aud.avg_ctr) || null; })();
    const dgRows = [], upRows = [], pkSorted = Object.entries(D.pk).filter(([, p]) => p.active).sort((a, b) => (a[1].price || 0) - (b[1].price || 0));
    Object.entries(D.reqs).forEach(([rid, r]) => {
      const run = r.status === "live" && r.end && r.end >= today, recent = ["live", "expired"].includes(r.status) && r.end && r.end < today && r.end >= addDays(today, -14);
      if (!run && !recent) return;
      const ids = reqAds(rid), w7 = EO_ADS.summarize(sumDays(ids, st), addDays(today, -6), today), all = EO_ADS.summarize(sumDays(ids, st), r.start || addDays(today, -29), r.end < today ? r.end : today);
      const first = String(r.sponsor_name || "").split(" ")[0] || "there", ph = r.sponsor_phone;
      if (run) {
        const top = ids.map((id) => ({ h: (D.ads[id] || {}).headline, x: EO_ADS.summarize(asObj(st[id]), addDays(today, -6), today) })).sort((a, b) => b.x.c - a.x.c)[0];
        const msg = `Hello ${first}, your weekly ad report (${(D.ads[ids[0]] || {}).headline || "your ad"}): ${w7.v} views and ${w7.c} clicks in the last 7 days (click rate ${w7.ctr.toFixed(2)}%${avgCtr ? ", site average " + avgCtr.toFixed(2) + "%" : ""}).${w7.ld ? " " + w7.ld + " people started a WhatsApp chat with you." : ""}${top && top.x.c ? ` Best ad: "${top.h}".` : ""} Your campaign runs until ${r.end}. Reply here if you want changes.`;
        dgRows.push(`<tr><td><strong>${E(r.sponsor_name || "")}</strong><br><span class="hint">${w7.v} views · ${w7.c} clicks · until ${E(r.end)}</span></td><td class="act">${ph ? `<a class="btn sm primary" href="${E(wa(ph, msg))}" target="_blank" rel="noopener">WhatsApp digest</a>` : '<span class="hint">no phone</span>'}</td></tr>`);
      }
      const good = all.v >= 100 && avgCtr && all.ctr >= avgCtr, nxt = pkSorted.find(([k, p]) => (p.price || 0) > (Number(r.price) || 0));
      const msg2 = good
        ? `Hello ${first}, your ad did well: ${all.v} views and ${all.c} clicks (${all.ctr.toFixed(2)}%), above our ${avgCtr.toFixed(2)}% average. ${nxt ? `Want even more reach? Our ${nxt[1].name} package adds ${(Number(nxt[1].max_ads) || 1)} ads${nxt[1].socials ? " and social posts" : ""}.` : "Shall we run it again?"}`
        : `Hello ${first}, your ad had ${all.v} views and ${all.c} clicks so far. We can improve it: a clearer headline, a stronger picture or a WhatsApp button usually helps. Want us to refresh it for free when you renew?`;
      upRows.push(`<tr><td><strong>${E(r.sponsor_name || "")}</strong> <span class="pill ${good ? "live" : "pending"}">${good ? "doing well" : all.v < 100 ? "too early" : "below average"}</span><br><span class="hint">${all.v} views · ${all.c} clicks · ${all.ctr.toFixed(2)}% · ${run ? "ends " + E(r.end) : "ended " + E(r.end)}</span></td><td class="act">${ph ? `<a class="btn sm" href="${E(wa(ph, msg2))}" target="_blank" rel="noopener">WhatsApp</a>` : ""}</td></tr>`);
    });
    $("#dg").innerHTML = dgRows.join("") || `<tr><td class="hint">No running campaigns.</td></tr>`;
    $("#up").innerHTML = upRows.join("") || `<tr><td class="hint">Nothing to suggest yet.</td></tr>`;
    $("#hm").onchange = (e) => ($("#hmout").innerHTML = heatHTML(heat[e.target.value]));
    const meRows = () => rev.filter((x) => x.date.startsWith($("#me").value)).sort((a, b) => a.date.localeCompare(b.date));
    const mePaint = () => { const r = meRows(); $("#meout").innerHTML = `<table class="tbl"><thead><tr><th>Date</th><th>Sponsor</th><th>Type</th><th>Detail</th><th>KES</th></tr></thead><tbody>${r.map((x) => `<tr><td>${E(x.date)}</td><td>${E(x.sponsor)}</td><td>${E(x.kind)}</td><td>${E(x.ref)}</td><td>${x.amount}</td></tr>`).join("") || `<tr><td colspan="5" class="hint">No payments in this month.</td></tr>`}</tbody><tfoot><tr><th colspan="4">Total</th><th>${r.reduce((n, x) => n + x.amount, 0)}</th></tr></tfoot></table>`; };
    $("#me").onchange = mePaint; mePaint();
    $("#me_csv").onclick = () => csvDown(`payments-${$("#me").value}.csv`, [["Date", "Sponsor", "Type", "Detail", "KES"]].concat(meRows().map((x) => [x.date, x.sponsor, x.kind, x.ref, x.amount])));
    $("#me_pr").onclick = () => printHTML("Ad payments — " + $("#me").value, $("#meout").innerHTML);
    pane.querySelectorAll("[data-share]").forEach((b) => (b.onclick = async () => {
      const rid = b.dataset.share, t = Array.from(crypto.getRandomValues(new Uint8Array(12)), (x) => x.toString(36).padStart(2, "0")).join("").slice(0, 20);
      try { await A.set("ad_share/" + t, await buildShare(rid)); await A.update("sponsor_fulfil/" + rid, { share: t }); D.ful[rid] = Object.assign({}, D.ful[rid], { share: t }); A.toast("Link created ✓"); analyticsTab(); } catch (e) { A.toast(e.message, true); }
    }));
    pane.querySelectorAll("[data-unshare]").forEach((b) => (b.onclick = async () => { const rid = b.dataset.unshare, t = D.ful[rid].share; try { await A.del("ad_share/" + t); await A.update("sponsor_fulfil/" + rid, { share: null }); D.ful[rid].share = null; A.toast("Link turned off"); analyticsTab(); } catch (e) { A.toast(e.message, true); } }));
    pane.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => { const u = location.origin + "/report.html?t=" + b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => A.toast("Link copied ✓"), () => prompt("Copy this link:", u)); }));
  }

  // auto-disable: when a package has run out, switch its ads off and mark the request expired
  async function applyPauses() {
    for (const [rid, p] of Object.entries(D.pause || {})) {
      const r = D.reqs[rid]; if (!r || p.applied || p.until_ms > Date.now()) continue;
      const days = Math.max(0, Math.min(60, Math.ceil((p.until_ms - p.from_ms) / 864e5)));
      try {
        if (r.end && days) { const ne = addDays(r.end, days); await A.update("sponsor_requests/" + rid, { end: ne, updated: Date.now() }); r.end = ne; for (const id of reqAds(rid)) await A.update("ads/" + id, { end: ne }); }
        await A.update("ad_pause/" + rid, { applied: true, days }); p.applied = true;
        A.toast(`Pause of ${days} day(s) added to ${r.sponsor_name || rid}'s campaign`);
      } catch {}
    }
  }
  async function refreshShares() {
    for (const [rid, F] of Object.entries(D.ful)) { if (F && F.share && D.reqs[rid]) { try { await A.set("ad_share/" + F.share, await buildShare(rid)); } catch {} } }
  }
  async function sweepExpired() {
    await applyPauses();
    let n = 0;
    for (const [rid, r] of Object.entries(D.reqs)) {
      if (r.status !== "live" || !r.end || r.end >= today) continue;
      if (D.pause && D.pause[rid] && !D.pause[rid].applied) continue;
      try { for (const id of reqAds(rid)) if (String(D.ads[id].active) !== "no") await A.update("ads/" + id, { active: "no" }); await A.update("sponsor_requests/" + rid, { status: "expired", updated: Date.now() }); n++; } catch {}
    }
    if (n) { A.toast(n + " finished campaign(s) switched off"); await load(); }
  }
  await load();
  await sweepExpired();
  await publishAvailability();
  refreshShares();
  const tabs = [["overview", "Overview"], ["requests", "Requests & payments"], ["ads", "All ads"], ["calendar", "Calendar"], ["types", "Ad types (on/off)"], ["packages", "Packages"], ["coupons", "Coupons"], ["sponsors", "Sponsors"], ["analytics", "Analytics"], ["metrics", "Metrics & revenue"], ["tools", "Tools"], ["log", "Log"]];
  const map = { overview, requests, ads: adsTab, calendar: calendarTab, types: typesTab, packages: packagesTab, coupons: couponsTab, sponsors: sponsorsTab, analytics: analyticsTab, metrics: metricsTab, tools: toolsTab, log: logTab };
  A.tabs($("#tabs"), tabs, (k) => map[k]());
})();
</script>
