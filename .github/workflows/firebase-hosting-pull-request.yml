# Preview link for pull requests (you push straight to main, so this only runs if you ever open a PR).
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild large files
        run: |
          bash join-large-files.sh
          find public -name '*.part[0-9][0-9]' -delete
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZRA_OGOMBO }}
          projectId: ezra-ogombo
          entryPoint: public
