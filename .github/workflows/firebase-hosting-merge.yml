# Deploys the site to Firebase Hosting every time main is pushed.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
concurrency:
  group: firebase-live
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # push.sh stores files over 50 MB as .part00, .part01 ... (your voice model).
      # Put them back together, then remove the pieces so only the real file is deployed.
      - name: Rebuild large files
        run: |
          bash join-large-files.sh
          find public -name '*.part[0-9][0-9]' -delete

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZRA_OGOMBO }}
          channelId: live
          projectId: ezra-ogombo
          entryPoint: public

  # Publishes public/database.rules.json to the Realtime Database whenever it changes.
  # If the service account lacks permission this job fails on its own and the site deploy above is not affected.
  deploy_rules:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Did the rules change?
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^public/database.rules.json$'; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy database rules
        if: steps.changed.outputs.go == '1'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZRA_OGOMBO }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only database --project ezra-ogombo --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
